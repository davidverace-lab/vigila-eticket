name: Vigila 2x1 eticket

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos (GitHub a veces lo retrasa unos minutos)
  workflow_dispatch:          # permite correrlo a mano con el botón "Run workflow"

permissions:
  contents: write

jobs:
  vigila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar eticket
        run: bash vigila_2x1.sh

      - name: Guardar estado (para no repetir avisos)
        run: |
          git config user.name "vigila-bot"
          git config user.email "vigila-bot@users.noreply.github.com"
          git add -A estado
          git diff --cached --quiet || (git commit -m "estado $(date -u +%FT%TZ)" && git push)
