name: ALERTA eticket Destino Dos Equis

on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # cada 15 min, fuera de los minutos saturados de GitHub
  workflow_dispatch:
    inputs:
      prueba:
        description: "Escribe si para forzar un aviso de prueba"
        default: "no"

permissions:
  contents: write

jobs:
  vigila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar eticket
        env:
          PRUEBA: ${{ github.event.inputs.prueba }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_KEY: ${{ secrets.WA_KEY }}
        run: bash vigila_2x1.sh

      - name: Guardar estado (para no repetir avisos)
        run: |
          git config user.name "vigila-bot"
          git config user.email "vigila-bot@users.noreply.github.com"
          git add -A estado
          git diff --cached --quiet || (git commit -m "estado $(date -u +%FT%TZ)" && git push)

      - name: "AVISO - si este paso falla es porque hay novedad en los boletos (GitHub manda correo)"
        run: |
          if [ -f alerta.txt ]; then
            echo "::error::$(tr '\n' ' ' < alerta.txt)"
            cat alerta.txt
            exit 1
          fi
          echo "Sin novedades."
